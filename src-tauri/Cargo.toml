[package]
name = "egant"
description = "A native desktop workspace for coding agents (Tauri edition)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "egant"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
egant-harness.workspace = true
egant-vcs.workspace = true
# `macos-private-api` is required whenever `macOSPrivateApi` is set in
# tauri.conf.json (tauri-build matches the feature name in this file on every
# OS). On Linux/Windows the feature is a compile-time no-op. `unstable` is
# needed for `Window::add_child` — the multiwebview API the Browser panel tab
# uses to layer a real webview per tab over the window (see `src/browser.rs`).
tauri = { workspace = true, features = ["macos-private-api", "unstable"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true

anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
env_logger.workspace = true
log.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
window-vibrancy = "0.8.0"
axum.workspace = true
tokio.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rust-embed.workspace = true
sha2.workspace = true
getrandom.workspace = true
qrcode.workspace = true

[dev-dependencies]
# Real repositories for the worktree tests: what `release` decides is only
# meaningful against git's own answers.
tempfile = "3"

[features]
default = []
