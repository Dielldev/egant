[package]
name = "egant-harness"
description = "Agent-backend abstraction: drives Claude Code (and later other CLIs) as a subprocess."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
async-process.workspace = true
async-trait.workspace = true
base64.workspace = true
futures-lite.workspace = true
log.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
serde.workspace = true
# `preserve_order`: the Library rewrites agents' JSON configs (`~/.claude.json`)
# and must hand them back in the order they were written, not sorted.
serde_json = { workspace = true, features = ["preserve_order"] }
toml_edit.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-lite.workspace = true
